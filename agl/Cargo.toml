[package]
name = "agl"
version = "0.1.0"
edition = "2024"
description = "A small, fast coding agent CLI for local models"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
ureq = { version = "3", features = ["json"] }
ratatui = "0.30.2"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
