# agterm Cloud control plane (docs/cloud-sessions-plan.md): accounts via agmux Teams, a Fly
# machine per user, Stripe billing, hourly metering.
name = "agterm-cloud"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true
routes = [{ pattern = "cloud.agterm.xanom.co", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "agterm-cloud"
database_id = "ab9ba36a-45e9-4526-a246-264059130901"

[triggers]
crons = ["7 * * * *"]

[vars]
TEAMS_URL = "https://teams.agmux.dev"
FLY_APP = "agterm-cloud-machines"
CLOUD_IMAGE = "registry.fly.io/agterm-cloud-machines:latest"
INCLUDED_HOURS = "100"
MAX_HOURS = "500"
STRIPE_OVERAGE_PRICE = "price_1UWP1NBPM9ZAoURp9l196RW4" # $0.10 an hour past 100, meter mtr_61VfmyjLaLhKdpSQZ41BPM9ZAoURp0iO
STRIPE_METER_EVENT = "agterm_cloud_overage_hours"
VOLUME_GB = "20"
STRIPE_PRICE = "price_1UWOhTBPM9ZAoURpxHnL4wJe" # agterm Cloud monthly, live agmux account
APP_ORIGIN = "https://cloud.agterm.xanom.co"

# Secrets (wrangler secret put): FLY_API_TOKEN, STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
