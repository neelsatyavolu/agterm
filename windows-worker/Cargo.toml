[package]
name = "agterm-worker"
version = "1.0.0"
edition = "2021"
description = "Runs tasks from agterm on a Windows PC"
license = "Apache-2.0"

[dependencies]
openssl = { version = "0.10", features = ["vendored"] }
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
