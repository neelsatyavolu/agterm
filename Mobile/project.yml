# agterm Remote: the iPhone app for agterm. Generate the Xcode project with `xcodegen` (see README.md).
name: AgTermRemote
options:
  bundleIdPrefix: co.xanom
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  AgTerm:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: VTQW687WBQ
targets:
  AgTermRemote:
    type: application
    platform: iOS
    sources:
      - path: AgTermRemote
    dependencies:
      - package: AgTerm
        product: AgTermCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.agterm.remote
        CODE_SIGN_ENTITLEMENTS: AgTermRemote/AgTermRemote.entitlements
        PRODUCT_NAME: agterm Remote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: agterm
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "agterm Remote scans the pairing code your Mac shows in agterm Settings."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        # App Store signing for scripts/release-ios.sh; Debug signs automatically.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: agterm Remote App Store
    info:
      path: AgTermRemote/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: co.xanom.agterm.remote
            CFBundleURLSchemes: [agterm-remote]
        UIUserInterfaceStyle: Dark
  AgTermRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgTermRemoteUITests
    dependencies:
      - target: AgTermRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.agterm.remote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgTermRemote
schemes:
  AgTermRemote:
    build:
      targets:
        AgTermRemote: all
    test:
      targets:
        - AgTermRemoteUITests
